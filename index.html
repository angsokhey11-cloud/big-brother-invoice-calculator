<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIG BROTHER</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #172033;
}

.calculator {
  width: 100%;
  max-width: 560px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 26px;
  margin: 8px 0 18px;
  color: #173b70;
  letter-spacing: 1px;
}

.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.invoice-title {
  font-size: 17px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  padding: 11px;
  border: 1px solid #c9d2df;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: #172033;
}

select {
  width: auto;
  min-width: 90px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}

.customer-status {
  font-size: 12px;
  color: #718096;
  margin-top: 5px;
  min-height: 15px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.customer-field {
  margin-top: 10px;
}

.exchange-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.exchange-row span {
  white-space: nowrap;
}

.exchange-input {
  flex: 1;
  min-width: 0;
}

.add-btn,
.action-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn {
  background: #5b78f6;
  color: white;
}

.product-selector {
  margin-top: 10px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  display: none;
}

.product-selector button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #eee;
  cursor: pointer;
}

.product {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.product-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.product-name {
  font-weight: bold;
  font-size: 16px;
}

.remove-btn {
  border: none;
  background: #eee;
  color: #555;
  border-radius: 7px;
  padding: 6px 10px;
  cursor: pointer;
  flex-shrink: 0;
}

.inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.product-total {
  text-align: right;
  font-weight: bold;
  margin-top: 12px;
}

.totals-box {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 7px 0;
  font-size: 16px;
}

.discount-row input {
  max-width: 150px;
  text-align: right;
}

.grand-total {
  border-top: 1px solid #ddd;
  margin-top: 8px;
  padding-top: 14px;
  font-size: 19px;
  font-weight: bold;
}

.payment-row input {
  max-width: 170px;
  text-align: right;
}

.change-row {
  font-weight: bold;
}

.convert-box {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
}

.convert-result {
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  padding: 12px;
  background: #f3f5f9;
  border-radius: 8px;
  line-height: 1.6;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.print-btn {
  background: #111;
  color: white;
}

.share-btn {
  background: #25d366;
  color: white;
}

.save-btn {
  background: #173b70;
  color: white;
}

.clear-btn {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #ddd;
  font-size: 16px;
  cursor: pointer;
}

@media (max-width: 450px) {
  body { padding: 8px; }

  h1 {
    font-size: 23px;
    margin-bottom: 14px;
  }

  /* Keep invoice number + date together on mobile */
  .invoice-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .invoice-grid input {
    font-size: 14px;
    padding: 9px;
  }

  .inputs {
    grid-template-columns: 1fr 1fr;
  }

  .actions {
    grid-template-columns: 1fr;
  }

  .top-bar {
    gap: 8px;
  }

  .invoice-title {
    font-size: 16px;
  }

  .card,
  .product,
  .totals-box,
  .convert-box {
    padding: 12px;
  }
}


@media print {
  #invoiceDate {
    color: transparent;
    position: relative;
  }

  #invoiceDate::after {
    content: attr(data-print-date);
    color: #111;
    position: absolute;
    left: 0;
    top: 0;
  }
}

@media print {
  body {
    background: white;
    padding: 0;
    color: #111;
  }

  .calculator {
    max-width: 100%;
  }

  .no-print,
  .add-btn,
  .product-selector,
  .remove-btn,
  .actions,
  .clear-btn {
    display: none !important;
  }

  .card,
  .product,
  .totals-box,
  .convert-box {
    border: 1px solid #ccc;
    break-inside: avoid;
  }

  input,
  select {
    border: none;
    padding: 2px 0;
    appearance: none;
  }
}

.date-input-wrap {
  position: relative;
  width: 100%;
}

#invoiceDateDisplay {
  width: 100%;
  cursor: pointer;
  background: #fff;
  position: relative;
  z-index: 1;
}

#invoiceDate {
  z-index: 2;
}

#invoiceDate {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: auto;
  cursor: pointer;
  border: 0;
  padding: 0;
}

</style>
</head>

<body>
<div class="calculator">

  <h1>BIG BROTHER</h1>

  <div class="top-bar">
    <div class="invoice-title">Invoice</div>
    <select id="currency" aria-label="Currency">
      <option value="USD">USD</option>
      <option value="KHR">KHR</option>
    </select>
  </div>

  <!-- INVOICE INFORMATION -->
  <div class="card">
    <div class="section-title">Invoice Information</div>

    <div class="grid-2 invoice-grid">
      <div>
        <label for="invoiceNumber">Invoice No.</label>
        <input type="text" id="invoiceNumber" value="INV-0001">
      </div>

      <div>
        <label for="invoiceDateDisplay">Date</label>
        <div class="date-input-wrap">
          <input
            type="text"
            id="invoiceDateDisplay"
            value=""
            placeholder="01-Sep-2026"
            readonly
          >
          <input
            type="date"
            id="invoiceDate"
            onchange="updateInvoiceDate()"
            aria-hidden="true"
            tabindex="-1"
          >
        </div>
      </div>
    </div>

    <div class="customer-field">
      <label for="customerName">Customer Name</label>
      <input
        type="text"
        id="customerName"
        list="customerOptions"
        placeholder="Type or select customer"
        autocomplete="off"
      >
      <datalist id="customerOptions"></datalist>
      <div id="customerStatus" class="customer-status">
        Loading customers...
      </div>
    </div>

    <div class="grid-2 customer-field">
      <div>
        <label for="customerPhone">Phone</label>
        <input type="tel" id="customerPhone" placeholder="Enter phone number">
      </div>

      <div>
        <label for="customerAddress">Address</label>
        <input type="text" id="customerAddress" placeholder="Enter address">
      </div>
    </div>

    <div class="grid-2 customer-field">
      <div>
        <label for="salesName">Sale Name</label>
        <input type="text" id="salesName" placeholder="Enter salesperson">
      </div>

      <div>
        <label for="paymentMethod">Payment Method</label>
        <select id="paymentMethod">
          <option value="Cash">Cash</option>
          <option value="Bank">Bank</option>
          <option value="Credit">Credit</option>
        </select>
      </div>
    </div>
  </div>

  <!-- EXCHANGE RATE -->
  <div class="card">
    <div class="section-title">Exchange Rate</div>

    <div class="exchange-row">
      <span>1 USD =</span>
      <input
        id="exchangeRate"
        class="exchange-input"
        type="number"
        min="1"
        value="4060"
        inputmode="decimal"
      >
      <span>KHR</span>
    </div>
  </div>

  <!-- ADD PRODUCT -->
  <button class="add-btn no-print" onclick="showProductSelector()">
    ＋ Add Product
  </button>

  <div id="productSelector" class="product-selector no-print">
    <select id="productChoice" onchange="addSelectedProduct()">
      <option value="">Select Product</option>
    </select>
  </div>

  <!-- PRODUCTS -->
  <div id="productList" class="product-list"></div>

  <!-- TOTALS -->
  <div class="totals-box">

    <div class="total-row">
      <span>Subtotal</span>
      <span id="subtotal">$0.00</span>
    </div>

    <div class="total-row discount-row">
      <span>Discount</span>
      <input
        type="number"
        id="discount"
        min="0"
        value="0"
        step="0.01"
        inputmode="decimal"
        oninput="calculate()"
      >
    </div>

    <div class="total-row grand-total">
      <span>Grand Total</span>
      <span id="grandTotal">$0.00</span>
    </div>

    <div class="total-row payment-row">
      <span>Amount Paid</span>
      <input
        type="number"
        id="amountPaid"
        min="0"
        value="0"
        step="0.01"
        inputmode="decimal"
        oninput="calculate()"
      >
    </div>

    <div class="total-row change-row">
      <span>Change</span>
      <span id="changeAmount">$0.00</span>
    </div>

  </div>

  <!-- EXCHANGE CALCULATION -->
  <div class="convert-box">
    <div class="section-title">Exchange Calculation</div>

    <div id="convertResult" class="convert-result">
      $0.00 = ៛0
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions no-print">
    <button type="button" class="action-btn print-btn" onclick="printInvoice(event)">
      🖨 Print / Save PDF
    </button>

    <button class="action-btn share-btn" onclick="shareInvoice()">
      ✈️ Share to Telegram
    </button>

    <button type="button" class="action-btn save-btn" onclick="saveInvoiceImage(event)">
      🖼️ Save Invoice Image
    </button>
  </div>

  <button class="clear-btn no-print" onclick="clearAll()">
    Clear
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* ==========================================
   TODAY'S DATE
========================================== */

function setTodayDate() {
  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  document.getElementById("invoiceDate").value =
    `${year}-${month}-${day}`;
}

setTodayDate();


/* ==========================================
   CUSTOMER DATABASE
   Google Sheets -> Apps Script Web App
========================================== */

const CUSTOMER_API_URL =
  "https://script.google.com/macros/s/AKfycbzKPsKptXGdxm9bZ8VJpWAc1XnFTCsfCOGzfn6GCmYYt-yHVw-DXsEHTrpnZf_EOFd4TA/exec";

let customers = [];


/* ==========================================
   LOAD CUSTOMERS
========================================== */

async function loadCustomers() {
  const status = document.getElementById("customerStatus");
  const list = document.getElementById("customerOptions");

  if (!status || !list) return;

  status.textContent = "Loading customers...";
  status.style.color = "#718096";

  try {
    const response = await fetch(CUSTOMER_API_URL, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Customer database returned an error.");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Invalid customer data.");
    }

    customers = data
      .map(customer => ({
        no: String(customer.no || ""),
        name: String(customer.name || "").trim(),
        phone: String(customer.phone || "").trim(),
        address: String(customer.address || "").trim()
      }))
      .filter(customer => customer.name);

    list.innerHTML = "";

    customers.forEach(customer => {
      const option = document.createElement("option");
      option.value = customer.name;

      if (customer.phone) {
        option.label = customer.phone;
      }

      list.appendChild(option);
    });

    status.textContent =
      customers.length + " customers loaded from Google Sheets";
    status.style.color = "#2f855a";

  } catch (error) {
    console.error("Customer database error:", error);

    customers = [];
    list.innerHTML = "";

    status.textContent =
      "Customer database unavailable — you can still type manually.";
    status.style.color = "#b7791f";
  }
}


/* ==========================================
   CUSTOMER SELECTION / AUTO-FILL
========================================== */

function findCustomerByName(name) {
  const cleanName = String(name || "").trim().toLowerCase();

  if (!cleanName) return null;

  return customers.find(customer =>
    customer.name.toLowerCase() === cleanName
  ) || null;
}

function fillCustomerInformation() {
  const nameInput = document.getElementById("customerName");
  const phoneInput = document.getElementById("customerPhone");
  const addressInput = document.getElementById("customerAddress");
  const status = document.getElementById("customerStatus");

  if (!nameInput || !phoneInput || !addressInput) return;

  const customer = findCustomerByName(nameInput.value);

  if (!customer) {
    /*
      IMPORTANT:
      Do not clear phone/address here.
      This keeps the customer fields fully manual if the user
      types a customer that is not in Google Sheets.
    */
    return;
  }

  phoneInput.value = customer.phone;
  addressInput.value = customer.address;

  if (status) {
    status.textContent = "Customer information loaded";
    status.style.color = "#2f855a";
  }
}


/* ==========================================
   PRODUCT LIST
   Default prices are USD.
========================================== */

const products = [
  { name: "Kirisu Milk 2L", usdPrice: 4.50 },
  { name: "Kirisu Milk 830ml", usdPrice: 2.20 },
  { name: "Kirisu Yogurt 135g", usdPrice: 0.66 },
  { name: "Farm Fresh 2L", usdPrice: 4.10 },
  { name: "Ausfresh 2L", usdPrice: 4.30 },
  { name: "Greenfield 1.90L", usdPrice: 3.80 },
  { name: "Greenfield 1L", usdPrice: 2.00 },
  { name: "VP Milk 2L", usdPrice: 3.80 },
  { name: "O'More 2L", usdPrice: 4.20 },
  { name: "Champei Milk 220ml", usdPrice: 0.50 }
];

let selectedProducts = [];


/* ==========================================
   HELPERS
========================================== */

function getCurrency() {
  return document.getElementById("currency").value;
}

function getExchangeRate() {
  return Number(document.getElementById("exchangeRate").value) || 0;
}

function usdToSelected(usdValue, currency) {
  if (currency === "KHR") {
    return usdValue * getExchangeRate();
  }

  return usdValue;
}

function selectedToUsd(value, currency) {
  if (currency === "KHR") {
    const rate = getExchangeRate();
    return rate > 0 ? value / rate : 0;
  }

  return value;
}

function formatMoney(value, currency) {
  if (currency === "USD") {
    return "$" + Number(value).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  return "៛" + Math.round(Number(value)).toLocaleString("en-US");
}


/* ==========================================
   SHOW PRODUCT SELECTOR
========================================== */

function showProductSelector() {
  const selector = document.getElementById("productSelector");
  const choice = document.getElementById("productChoice");

  choice.innerHTML = `
    <option value="">Select Product</option>
  `;

  const availableProducts = products.filter(product =>
    !selectedProducts.some(item => item.id === product.name)
  );

  if (availableProducts.length === 0) {
    alert("All products have already been added.");
    return;
  }

  availableProducts.forEach(product => {
    const option = document.createElement("option");
    option.value = product.name;
    option.textContent = product.name;
    choice.appendChild(option);
  });

  selector.style.display = "block";
}


/* ==========================================
   ADD SELECTED PRODUCT
========================================== */

function addSelectedProduct() {
  const choice = document.getElementById("productChoice");
  const productName = choice.value;

  if (!productName) return;

  const product = products.find(p => p.name === productName);

  if (!product) return;

  selectedProducts.push({
    id: product.name,
    usdPrice: product.usdPrice
  });

  createProduct(product.name, product.usdPrice);

  choice.value = "";
  document.getElementById("productSelector").style.display = "none";

  calculate();
}


/* ==========================================
   CREATE PRODUCT
========================================== */

function createProduct(name, defaultUsdPrice) {
  const container = document.getElementById("productList");
  const div = document.createElement("div");

  div.className = "product";
  div.dataset.product = name;
  div.dataset.usdPrice = defaultUsdPrice;

  const currency = getCurrency();
  const displayPrice = usdToSelected(defaultUsdPrice, currency);

  div.innerHTML = `
    <div class="product-header">
      <div class="product-name">${escapeHtml(name)}</div>

      <button
        class="remove-btn no-print"
        onclick="removeProduct(this)"
      >×</button>
    </div>

    <div class="inputs">

      <div>
        <span class="input-label">QTY</span>
        <input
          type="number"
          min="0"
          value="0"
          inputmode="decimal"
          oninput="calculate()"
        >
      </div>

      <div>
        <span class="input-label">PRICE</span>
        <input
          type="number"
          min="0"
          value="${displayPrice}"
          step="${currency === "KHR" ? "1" : "0.01"}"
          inputmode="decimal"
          oninput="priceChanged(this)"
        >
      </div>

    </div>

    <div class="product-total">
      Total:
      <span class="line-total">${formatMoney(0, currency)}</span>
    </div>
  `;

  container.appendChild(div);
}


/* ==========================================
   PRICE CHANGE
   User can freely adjust the price.
========================================== */

function priceChanged(input) {
  const product = input.closest(".product");
  const currency = getCurrency();
  const enteredPrice = Number(input.value) || 0;

  product.dataset.usdPrice =
    selectedToUsd(enteredPrice, currency);

  const item = selectedProducts.find(
    p => p.id === product.dataset.product
  );

  if (item) {
    item.usdPrice = Number(product.dataset.usdPrice);
  }

  calculate();
}


/* ==========================================
   REMOVE PRODUCT
========================================== */

function removeProduct(button) {
  const product = button.closest(".product");
  const name = product.dataset.product;

  selectedProducts =
    selectedProducts.filter(item => item.id !== name);

  product.remove();

  calculate();
}


/* ==========================================
   CALCULATE
========================================== */

function calculate() {
  let total = 0;
  const currency = getCurrency();

  document.querySelectorAll(".product").forEach(product => {

    const inputs = product.querySelectorAll("input");

    const qty = Number(inputs[0].value) || 0;
    const price = Number(inputs[1].value) || 0;

    const lineTotal = qty * price;
    total += lineTotal;

    product.querySelector(".line-total").textContent =
      formatMoney(lineTotal, currency);
  });


  /* SUBTOTAL */

  document.getElementById("subtotal").textContent =
    formatMoney(total, currency);


  /* DISCOUNT */

  const discount =
    Number(document.getElementById("discount").value) || 0;

  const finalTotal =
    Math.max(0, total - discount);


  /* GRAND TOTAL */

  document.getElementById("grandTotal").textContent =
    formatMoney(finalTotal, currency);


  /* AMOUNT PAID + CHANGE */

  const amountPaid =
    Number(document.getElementById("amountPaid").value) || 0;

  const change =
    Math.max(0, amountPaid - finalTotal);

  document.getElementById("changeAmount").textContent =
    formatMoney(change, currency);


  /* EXCHANGE */

  calculateExchange(finalTotal, currency);
}


/* ==========================================
   CURRENCY CHANGE
   Convert existing product prices so that
   the actual price remains the same.
========================================== */

function changeCurrency() {
  const currency = getCurrency();
  const rate = getExchangeRate();

  if (currency === "KHR" && rate <= 0) {
    alert("Please enter a valid exchange rate.");
    document.getElementById("currency").value = "USD";
    return;
  }

  document.querySelectorAll(".product").forEach(product => {
    const inputs = product.querySelectorAll("input");

    const usdPrice = Number(product.dataset.usdPrice) || 0;

    inputs[1].value =
      usdToSelected(usdPrice, currency);

    inputs[1].step =
      currency === "KHR" ? "1" : "0.01";
  });

  calculate();
}


/* ==========================================
   EXCHANGE CALCULATION
   Always shows BOTH currencies.
========================================== */

function calculateExchange(finalTotal, currency) {
  const rate = getExchangeRate();
  const result = document.getElementById("convertResult");

  if (rate <= 0) {
    result.textContent = "Enter exchange rate";
    return;
  }

  let usd;
  let khr;

  if (currency === "USD") {
    usd = finalTotal;
    khr = finalTotal * rate;
  } else {
    khr = finalTotal;
    usd = finalTotal / rate;
  }

  result.innerHTML =
    `<div>${formatMoney(usd, "USD")}</div>` +
    `<div>=</div>` +
    `<div>${formatMoney(khr, "KHR")}</div>`;
}


/* ==========================================
   PRINT
========================================== */

function formatInvoiceDate(dateValue) {
  if (!dateValue) return "";

  const parts = dateValue.split("-");
  if (parts.length !== 3) return dateValue;

  const [year, month, day] = parts;
  const months = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
  ];

  return `${day}-${months[Number(month) - 1]}-${year}`;
}

function openDatePicker() {
  const picker = document.getElementById("invoiceDate");
  if (!picker) return;

  try {
    if (typeof picker.showPicker === "function") {
      picker.showPicker();
    } else {
      picker.focus();
      picker.click();
    }
  } catch (e) {
    picker.focus();
    picker.click();
  }
}

function updateInvoiceDate() {
  const picker = document.getElementById("invoiceDate");
  const display = document.getElementById("invoiceDateDisplay");

  if (picker && display) {
    display.value = formatInvoiceDate(picker.value);
  }
}



document.addEventListener("DOMContentLoaded", () => {
  const picker = document.getElementById("invoiceDate");
  if (picker && !picker.value) {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    picker.value = `${yyyy}-${mm}-${dd}`;
  }
  updateInvoiceDate();
});

function printInvoice(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  calculate();

  const dateInput = document.getElementById("invoiceDate");
  if (dateInput) {
    dateInput.setAttribute(
      "data-print-date",
      formatInvoiceDate(dateInput.value)
    );
  }

  /*
    IMPORTANT FOR MOBILE:
    Call window.print() directly from the user's button tap.
    Some mobile browsers/webviews ignore delayed print calls.
  */
  try {
    if (typeof window.print === "function") {
      window.print();
      return;
    }
  } catch (error) {
    console.log("Direct print unavailable:", error);
  }

  /*
    Fallback for browsers/webviews that don't expose window.print().
    Because this runs directly from the user's tap, the new window is
    much less likely to be blocked as a popup.
  */
  try {
    const printWindow = window.open("", "_blank");

    if (!printWindow) {
      alert("Please allow pop-ups for this invoice to print.");
      return;
    }

    const printableHtml = document.documentElement.outerHTML;

    printWindow.document.open();
    printWindow.document.write(printableHtml);
    printWindow.document.close();

    printWindow.onload = () => {
      setTimeout(() => {
        printWindow.focus();
        printWindow.print();
      }, 300);
    };
  } catch (error) {
    alert("Printing is not supported by this browser. Please open the invoice in Chrome or Safari and try again.");
  }
}


/* ==========================================
   SAVE INVOICE AS IMAGE
========================================== */

async function saveInvoiceImage(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  calculate();

  if (typeof html2canvas !== "function") {
    alert("Image saver is not available. Please refresh the page and try again.");
    return;
  }

  const invoice = document.querySelector(".calculator");
  if (!invoice) return;

  const button = event && event.currentTarget
    ? event.currentTarget
    : document.querySelector(".save-btn");

  const originalText = button ? button.innerHTML : "";

  try {
    if (button) {
      button.disabled = true;
      button.innerHTML = "⏳ Saving...";
    }

    // Make a clean copy so the saved picture does not include buttons.
    const clone = invoice.cloneNode(true);

    clone.querySelectorAll(".no-print, .actions, .clear-btn, .product-selector")
      .forEach(el => el.remove());

    // Copy the current values into the cloned form fields.
    const originalFields = invoice.querySelectorAll("input, select, textarea");
    const clonedFields = clone.querySelectorAll("input, select, textarea");

    originalFields.forEach((field, index) => {
      const cloned = clonedFields[index];
      if (!cloned) return;

      if (field.tagName === "SELECT") {
        cloned.value = field.value;
      } else {
        cloned.value = field.value;
      }
    });

    clone.style.width = invoice.offsetWidth + "px";
    clone.style.maxWidth = "none";
    clone.style.margin = "0";
    clone.style.background = "#eef2f7";
    clone.style.padding = "15px";
    clone.style.position = "fixed";
    clone.style.left = "-100000px";
    clone.style.top = "0";
    clone.style.zIndex = "-1";

    document.body.appendChild(clone);

    const canvas = await html2canvas(clone, {
      backgroundColor: "#eef2f7",
      scale: Math.min(3, Math.max(2, window.devicePixelRatio || 1)),
      useCORS: true,
      logging: false,
      scrollX: 0,
      scrollY: 0
    });

    clone.remove();

    const invoiceNo =
      document.getElementById("invoiceNumber").value.trim() || "Invoice";

    const safeName = invoiceNo
      .replace(/[^a-z0-9_-]+/gi, "-")
      .replace(/^-+|-+$/g, "") || "Invoice";

    const fileName = `BIG-BROTHER-${safeName}.png`;

    canvas.toBlob(blob => {
      if (!blob) {
        alert("Could not create the invoice image. Please try again.");
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.rel = "noopener";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, "image/png");

  } catch (error) {
    console.error("Save invoice image failed:", error);
    alert("Could not save the invoice image. Please try again.");
  } finally {
    if (button) {
      button.disabled = false;
      button.innerHTML = originalText;
    }
  }
}


/* ==========================================
   SHARE
========================================== */

function shareInvoice() {
  calculate();

  const invoiceNo =
    document.getElementById("invoiceNumber").value || "Invoice";

  const customer =
    document.getElementById("customerName").value || "Customer";

  const date =
    formatInvoiceDate(document.getElementById("invoiceDate").value);

  const saleName =
    document.getElementById("salesName").value || "";

  const paymentMethod =
    document.getElementById("paymentMethod").value || "Cash";

  const total =
    document.getElementById("grandTotal").textContent;

  const message =
`BIG BROTHER INVOICE
Invoice No.: ${invoiceNo}
Date: ${date}
Customer: ${customer}
Sales: ${saleName}
Payment: ${paymentMethod}

Grand Total: ${total}

Thank you for your business!`;

  /*
    Try Telegram's native app first using Telegram's official tg://
    deep-link. If the app is not installed or the browser blocks the
    custom scheme, fall back to Telegram's HTTPS share page.
  */
  const encodedText = encodeURIComponent(message);

  const telegramAppUrl =
    "tg://msg_url?url=&text=" + encodedText;

  const telegramWebUrl =
    "https://t.me/share/url?url=&text=" + encodedText;

  let appOpened = false;

  const onVisibilityChange = () => {
    if (document.hidden) {
      appOpened = true;
    }
  };

  document.addEventListener("visibilitychange", onVisibilityChange, {
    once: true
  });

  // Native Telegram app first.
  window.location.href = telegramAppUrl;

  // If Telegram did not open, use the web version.
  setTimeout(() => {
    document.removeEventListener("visibilitychange", onVisibilityChange);

    if (!appOpened && !document.hidden) {
      window.location.href = telegramWebUrl;
    }
  }, 1200);
}
