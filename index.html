<!DOCTYPE html>
<html>
<h2>BIG BROTHER</h2>
<div class="invoice-info">

  <div class="invoice-title">
    INVOICE
  </div>

  <div class="invoice-row">
    <div>
      <label>Invoice No.</label>
      <input
        type="text"
        id="invoiceNumber"
        value="INV-0001"
      >
    </div>

    <div>
      <label>Date</label>
      <input
        type="date"
        id="invoiceDate"
      >
    </div>
  </div>

  <div class="customer-field">
    <label>Customer Name</label>
    <input
      type="text"
      id="customerName"
      placeholder="Enter customer name"
    >
  </div>

</div>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIG BROTHER Invoice Calculator</title>

<style>
.invoice-info {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.invoice-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 15px;
}

.invoice-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.invoice-info label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}

.invoice-info input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

.customer-field {
  margin-top: 5px;
}

@media (max-width: 450px) {
  .invoice-row {
    grid-template-columns: 1fr;
  }
}
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
}

.calculator {
  width: 100%;
  max-width: 500px;
  margin: auto;
}

/* TITLE */

h1 {
  text-align: center;
  font-size: 25px;
  margin: 15px 0 25px;
}

/* TOP BAR */

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.invoice-title {
  font-size: 17px;
  font-weight: bold;
}

select {
  padding: 10px 14px;
  border-radius: 9px;
  border: 1px solid #ccc;
  background: white;
  font-size: 15px;
}

/* EXCHANGE RATE */

.exchange-box {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 15px;
}

.exchange-title {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 10px;
}

.exchange-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.exchange-row span {
  white-space: nowrap;
}

.exchange-input {
  flex: 1;
  min-width: 0;
}

/* BUTTON */

.add-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #5b78f6;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn:active {
  transform: scale(0.99);
}

/* PRODUCT LIST */

.product-list {
  margin-top: 15px;
}

/* PRODUCT */

.product {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.product-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.product-name {
  font-weight: bold;
  font-size: 16px;
}

.remove-btn {
  border: none;
  background: #eee;
  color: #555;
  border-radius: 7px;
  padding: 5px 9px;
  cursor: pointer;
}

/* INPUTS */

.inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.input-label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

/* PRODUCT TOTAL */

.product-total {
  text-align: right;
  font-weight: bold;
  margin-top: 12px;
}

/* GRAND TOTAL */

.grand-total {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-top: 15px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 18px;
  font-weight: bold;
}

/* EXCHANGE CALCULATION */

.convert-box {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 16px;
  margin-top: 12px;
}

.convert-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.convert-result {
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  padding: 10px;
  background: #f3f5f9;
  border-radius: 8px;
}

/* CLEAR */

.clear-btn {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #ddd;
  font-size: 16px;
  cursor: pointer;
}

/* PRODUCT SELECT POPUP */

.product-selector {
  margin-top: 12px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  display: none;
}

.product-selector select {
  width: 100%;
}

</style>

</head>

<body>

<div class="calculator">

  <h1>BIG BROTHER</h1>

  <div class="top-bar">

    <div class="invoice-title">
      Invoice Calculator
    </div>

    <select id="currency">

      <option value="KHR">
        KHR
      </option>

      <option value="USD">
        USD
      </option>

    </select>

  </div>


  <!-- EXCHANGE RATE -->

  <div class="exchange-box">

    <div class="exchange-title">
      Exchange Rate
    </div>

    <div class="exchange-row">

      <span>1 USD =</span>

      <input
        id="exchangeRate"
        class="exchange-input"
        type="number"
        min="1"
        value="4060"
        inputmode="decimal"
      >

      <span>KHR</span>

    </div>

  </div>


  <!-- ADD PRODUCT -->

  <button
    class="add-btn"
    onclick="showProductSelector()"
  >

    ＋ Add Product

  </button>


  <!-- PRODUCT SELECTOR -->

  <div
    id="productSelector"
    class="product-selector"
  >

    <select
      id="productChoice"
      onchange="addSelectedProduct()"
    >

      <option value="">
        Select Product
      </option>

    </select>

  </div>


  <!-- PRODUCTS -->

  <div
    id="productList"
    class="product-list"
  ></div>


  <!-- GRAND TOTAL -->

  <div class="grand-total">

    <span>
      Grand Total
    </span>

    <span id="grandTotal">
      ៛0
    </span>

  </div>


  <!-- EXCHANGE CALCULATION -->

  <div class="convert-box">

    <div class="convert-title">
      Exchange Calculation
    </div>

    <div
      id="convertResult"
      class="convert-result"
    >
      ៛0 = $0.00
    </div>

  </div>


  <!-- CLEAR -->

  <button
    class="clear-btn"
    onclick="clearAll()"
  >

    Clear

  </button>

</div>


<script>
function setTodayDate() {

  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  document.getElementById("invoiceDate").value =
    `${year}-${month}-${day}`;
}

setTodayDate();

/* ==========================================
   PRODUCT LIST
========================================== */

const products = [
  { name: "Kirisu Milk 2L", usdPrice: 4.50 },
  { name: "Kirisu Milk 830ml", usdPrice: 2.20 },
  { name: "Kirisu Yogurt 135g", usdPrice: 0.66 },
  { name: "Farm Fresh 2L", usdPrice: 4.10 },
  { name: "Ausfresh 2L", usdPrice: 4.30 },
  { name: "VP Milk 2L", usdPrice: 3.80 },
  { name: "Greenfield 1.90L", usdPrice: 3.80 },
  { name: "Greenfield 1L", usdPrice: 2.00 },
  { name: "O'More 2L", usdPrice: 4.20 },
  { name: "Champei Milk 220ml", usdPrice: 0.50 }
];


/* ==========================================
   SELECTED PRODUCTS
========================================== */

let selectedProducts = [];


/* ==========================================
   SHOW PRODUCT SELECTOR
========================================== */

function showProductSelector() {

  const selector =
    document.getElementById("productSelector");

  const choice =
    document.getElementById("productChoice");

  choice.innerHTML = `
    <option value="">Select Product</option>
  `;

  const availableProducts =
    products.filter(product =>
      !selectedProducts.includes(product.name)
    );

  if (availableProducts.length === 0) {

    alert("All products have already been added.");

    return;
  }

  availableProducts.forEach(product => {

    const option =
      document.createElement("option");

    option.value = product.name;

    option.textContent = product.name;

    choice.appendChild(option);

  });

  selector.style.display = "block";
}


/* ==========================================
   ADD SELECTED PRODUCT
========================================== */

function addSelectedProduct() {

  const choice =
    document.getElementById("productChoice");

  const productName = choice.value;

  if (!productName) {
    return;
  }

  const product =
    products.find(p => p.name === productName);

  if (!product) {
    return;
  }

  selectedProducts.push(product.name);

  createProduct(
    product.name,
    product.usdPrice
  );

  choice.value = "";

  document
    .getElementById("productSelector")
    .style.display = "none";

  calculate();
}


/* ==========================================
   CREATE PRODUCT
========================================== */

function createProduct(name, defaultPrice) {

  const container =
    document.getElementById("productList");

  const div =
    document.createElement("div");

  div.className = "product";

  div.dataset.product = name;

  div.innerHTML = `

    <div class="product-header">

      <div class="product-name">
        ${name}
      </div>

      <button
        class="remove-btn"
        onclick="removeProduct(this)"
      >
        ×
      </button>

    </div>

    <div class="inputs">

      <div>

        <span class="input-label">
          QTY
        </span>

        <input
          type="number"
          min="0"
          value="0"
          inputmode="decimal"
          oninput="calculate()"
        >

      </div>

      <div>

        <span class="input-label">
          PRICE
        </span>

        <input
          type="number"
          min="0"
          value="${defaultPrice}"
          inputmode="decimal"
          step="0.01"
          oninput="calculate()"
        >

      </div>

    </div>

    <div class="product-total">

      Total:

      <span class="line-total">
        $0.00
      </span>

    </div>

  `;

  container.appendChild(div);

}


/* ==========================================
   REMOVE PRODUCT
========================================== */

function removeProduct(button) {

  const product =
    button.closest(".product");

  const name =
    product.dataset.product;

  selectedProducts =
    selectedProducts.filter(
      item => item !== name
    );

  product.remove();

  calculate();

}


/* ==========================================
   CALCULATE
========================================== */

function calculate() {

  let total = 0;

  const currency =
    document.getElementById(
      "currency"
    ).value;


  document
    .querySelectorAll(".product")
    .forEach(product => {

      const inputs =
        product.querySelectorAll("input");

      const qty =
        Number(inputs[0].value) || 0;

      const price =
        Number(inputs[1].value) || 0;

      const lineTotal =
        qty * price;

      total += lineTotal;


      product
        .querySelector(".line-total")
        .textContent =
          formatMoney(
            lineTotal,
            currency
          );

    });


  /* GRAND TOTAL */

  document
    .getElementById("grandTotal")
    .textContent =
      formatMoney(
        total,
        currency
      );


  /* EXCHANGE */

  calculateExchange(total, currency);

}


/* ==========================================
   EXCHANGE CALCULATION
========================================== */

function calculateExchange(
  total,
  currency
) {

  const rate =
    Number(
      document.getElementById(
        "exchangeRate"
      ).value
    ) || 0;


  const result =
    document.getElementById(
      "convertResult"
    );


  if (rate <= 0) {

    result.textContent =
      "Enter exchange rate";

    return;

  }


  if (currency === "USD") {

    const khr =
      total * rate;

    result.textContent =
      "$" +
      total.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      )
      +
      " = ៛" +
      Math.round(khr)
        .toLocaleString();

  }


  else {

    const usd =
      total / rate;

    result.textContent =
      "៛" +
      Math.round(total)
        .toLocaleString()
      +
      " = $" +
      usd.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  }

}


/* ==========================================
   FORMAT MONEY
========================================== */

function formatMoney(
  value,
  currency
) {

  if (currency === "USD") {

    return "$" +
      value.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  }


  return "៛" +
    Math.round(value)
      .toLocaleString();

}


/* ==========================================
   CURRENCY CHANGE
========================================== */

document
  .getElementById("currency")
  .addEventListener(
    "change",
    calculate
  );


/* ==========================================
   EXCHANGE RATE CHANGE
========================================== */

document
  .getElementById("exchangeRate")
  .addEventListener(
    "input",
    calculate
  );


/* ==========================================
   CLEAR EVERYTHING
========================================== */

function clearAll() {

  selectedProducts = [];

  document
    .getElementById(
      "productList"
    )
    .innerHTML = "";

  document
    .getElementById(
      "productSelector"
    )
    .style.display = "none";

  calculate();

}

</script>

</body>
</html>
