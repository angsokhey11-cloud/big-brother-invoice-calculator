<!DOCTYPE html>
<!-- BIG BROTHER MASTER ACCOUNTANT FINAL: Master DB for reference data; Sales DB for executed transactions. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="bb-template" content="Invoice Item: Invoice ID + Invoice No + Product Code groups (QTY | Price | Total)">
<title>BIG BROTHER — MASTER ACCOUNTANT</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #172033;
}

.calculator {
  width: 100%;
  max-width: 560px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 26px;
  margin: 8px 0 18px;
  color: #173b70;
  letter-spacing: 1px;
}

.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.invoice-title {
  font-size: 17px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  padding: 11px;
  border: 1px solid #c9d2df;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: #172033;
}

select {
  width: auto;
  min-width: 90px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}

.location-help {
  margin-top: 4px;
  font-size: 11px;
  color: #718096;
}

#invoiceNumber {
  font-weight: 700;
  letter-spacing: .5px;
}

.customer-status {
  font-size: 12px;
  color: #718096;
  margin-top: 5px;
  min-height: 15px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.customer-field {
  margin-top: 10px;
}

.exchange-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.exchange-row span {
  white-space: nowrap;
}

.exchange-input {
  flex: 1;
  min-width: 0;
}

.add-btn,
.action-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn {
  background: #5b78f6;
  color: white;
}

.product-selector {
  margin-top: 10px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  display: none;
}

.product-selector button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #eee;
  cursor: pointer;
}

.product {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.product-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.product-name {
  font-weight: bold;
  font-size: 16px;
}

.remove-btn {
  border: none;
  background: #eee;
  color: #555;
  border-radius: 7px;
  padding: 6px 10px;
  cursor: pointer;
  flex-shrink: 0;
}

.inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.product-total {
  text-align: right;
  font-weight: bold;
  margin-top: 12px;
}

.totals-box {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 7px 0;
  font-size: 16px;
}

.discount-row input {
  max-width: 150px;
  text-align: right;
}

.grand-total {
  border-top: 1px solid #ddd;
  margin-top: 8px;
  padding-top: 14px;
  font-size: 19px;
  font-weight: bold;
}

.payment-row input {
  max-width: 170px;
  text-align: right;
}

.change-row {
  font-weight: bold;
}

.convert-box {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
}

.convert-result {
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  padding: 12px;
  background: #f3f5f9;
  border-radius: 8px;
  line-height: 1.6;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.print-btn {
  background: #111;
  color: white;
}

.share-btn {
  background: #25d366;
  color: white;
}

.save-btn {
  background: #173b70;
  color: white;
}

.clear-btn {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #ddd;
  font-size: 16px;
  cursor: pointer;
}

@media (max-width: 450px) {
  body { padding: 8px; }

  h1 {
    font-size: 23px;
    margin-bottom: 14px;
  }

  /* Keep invoice number + date together on mobile */
  .invoice-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .invoice-grid input {
    font-size: 14px;
    padding: 9px;
  }

  .inputs {
    grid-template-columns: 1fr 1fr;
  }

  .actions {
    grid-template-columns: 1fr;
  }

  .top-bar {
    gap: 8px;
  }

  .invoice-title {
    font-size: 16px;
  }

  .card,
  .product,
  .totals-box,
  .convert-box {
    padding: 12px;
  }
}


@media print {
  #invoiceDate {
    color: transparent;
    position: relative;
  }

  #invoiceDate::after {
    content: attr(data-print-date);
    color: #111;
    position: absolute;
    left: 0;
    top: 0;
  }
}

@media print {
  body {
    background: white;
    padding: 0;
    color: #111;
  }

  .calculator {
    max-width: 100%;
  }

  .no-print,
  .add-btn,
  .product-selector,
  .remove-btn,
  .actions,
  .clear-btn {
    display: none !important;
  }

  .card,
  .product,
  .totals-box,
  .convert-box {
    border: 1px solid #ccc;
    break-inside: avoid;
  }

  input,
  select {
    border: none;
    padding: 2px 0;
    appearance: none;
  }
}

.date-input-wrap {
  position: relative;
  width: 100%;
}

#invoiceDateDisplay {
  width: 100%;
  cursor: pointer;
  background: #fff;
  position: relative;
  z-index: 1;
}

#invoiceDate {
  z-index: 2;
}

#invoiceDate {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: auto;
  cursor: pointer;
  border: 0;
  padding: 0;
}

#dueDateDisplay {
  width: 100%;
  cursor: pointer;
  background: #fff;
  position: relative;
  z-index: 1;
}

#dueDate {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: auto;
  cursor: pointer;
  border: 0;
  padding: 0;
}



/* ==========================================
   CUSTOMER AUTOCOMPLETE - COMPACT MOBILE
   ========================================== */

.customer-autocomplete {
  position: relative;
  width: 100%;
}

.customer-options {
  display: none;
  position: absolute;
  z-index: 1000;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 210px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid #9bb7dc;
  border-radius: 9px;
  box-shadow: 0 6px 18px rgba(23, 59, 112, 0.16);
}

.customer-option {
  padding: 9px 11px;
  border-bottom: 1px solid #e7edf5;
  cursor: pointer;
  line-height: 1.25;
  background: #fff;
}

.customer-option:last-child {
  border-bottom: none;
}

.customer-option:active,
.customer-option:hover {
  background: #eef5ff;
}

.customer-option-name {
  font-size: 14px;
  font-weight: 600;
  color: #172033;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.customer-option-details {
  margin-top: 2px;
  font-size: 11px;
  color: #66758a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bottom-action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}
.bottom-action-row .clear-btn { margin-top: 0; }
.preview-btn { background: #eef3fb; color: #2867b2; border: 1px solid #9db6d8; }
.invoice-preview-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 99999;
  padding: 20px;
  overflow: auto;
}
.invoice-preview-modal.open { display: flex; align-items: flex-start; justify-content: center; }
.invoice-preview-dialog {
  width: min(900px, 100%);
  max-height: calc(100vh - 40px);
  background: #fff;
  border-radius: 14px;
  overflow: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.invoice-preview-header {
  position: sticky; top: 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd;
}
.invoice-preview-close {
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: #eee; font-size: 24px; cursor: pointer;
}
.invoice-preview-content { padding: 16px; }
@media (max-width: 600px) {
  .bottom-action-row { grid-template-columns: 1fr 1fr; }

  .customer-options {
    max-height: 180px;
  }

  .customer-option {
    padding: 8px 10px;
  }
}

/* ==========================================
   BIG BROTHER PROFESSIONAL INVOICE DESIGN
   ========================================== */

.calculator {
  max-width: 560px;
}

h1 {
  color: #174a91;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.card,
.product,
.totals-box,
.convert-box,
.product-selector {
  border: 1.5px solid #9bb7dc;
  box-shadow: 0 3px 12px rgba(23, 59, 112, 0.08);
}

.card {
  border-top: 4px solid #2867d7;
}

.product {
  border-left: 4px solid #2867d7;
}

.totals-box {
  border-top: 4px solid #2f855a;
}

.convert-box {
  border-top: 4px solid #7c5ac7;
  background: linear-gradient(135deg, #ffffff, #f8f6ff);
}

.section-title {
  color: #174a91;
}

select,
input {
  border: 1.5px solid #b7c9e2;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

select:focus,
input:focus {
  outline: none;
  border-color: #2867d7;
  box-shadow: 0 0 0 3px rgba(40, 103, 215, 0.12);
}

.add-btn {
  background: linear-gradient(135deg, #5b78f6, #2867d7);
  box-shadow: 0 4px 10px rgba(40, 103, 215, 0.20);
}

.grand-total {
  border-top: 1.5px solid #cbd8e8;
  color: #123e78;
}

.change-row {
  color: #16733d;
}

.convert-result {
  border: 1px solid #ddd5f2;
  background: #f5f2fb;
}

.action-btn {
  border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 3px 8px rgba(0,0,0,0.10);
}

.print-btn {
  background: #172333;
}

.share-btn {
  background: #159447;
}

.save-btn {
  background: #2867d7;
}

.complete-btn {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: 1px solid #d59b00;
  border-radius: 10px;
  background: linear-gradient(135deg, #ffd84d, #f2ad00);
  color: #222;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(213, 155, 0, 0.18);
}

.complete-btn:hover {
  background: linear-gradient(135deg, #ffe36d, #f6ba18);
}

.complete-btn:active {
  transform: translateY(1px);
}

@media (max-width: 450px) {
  .card,
  .product,
  .totals-box,
  .convert-box {
    border-radius: 11px;
  }

  .complete-btn {
    min-height: 50px;
  }
}

/* Keep professional borders in printed invoice too. */
@media print {
  .card,
  .product,
  .totals-box,
  .convert-box {
    border-color: #9bb7dc !important;
  }

  .card {
    border-top: 3px solid #2867d7 !important;
  }

  .product {
    border-left: 3px solid #2867d7 !important;
  }

  .totals-box {
    border-top: 3px solid #2f855a !important;
  }

  }

   TABLE-STYLE PRODUCT LIST
   Compact like the reference picture
   ========================================== */
.product-table-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 58px 72px 86px;

  align-items: center;
  padding: 6px 8px;
  margin-top: 7px;
  border: 1px solid #c8d5e6;
  border-bottom: 0;
  border-radius: 9px 9px 0 0;
  background: #edf3fa;
  color: #173f73;
  font-size: 11px;
  font-weight: 800;
  text-align: center;
}

.product-table-head span:first-child {
  text-align: left;
}

.product-list {
  margin-top: 0;
}

.product {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) 58px 72px 86px;
  gap: 6px;
  align-items: center;
  min-height: 44px;
  padding: 5px 8px !important;
  margin: 0 !important;
  border: 1px solid #c8d5e6 !important;

}

.product:last-child {

}

}

.product-input-cell input {
  width: 100%;
  height: 31px !important;

  border-radius: 6px !important;
  font-size: 12px !important;
  text-align: center;

.product-total-cell {

.remove-btn {

/* ==========================================
   OPTIONAL DISCOUNT / PAYMENT / EXCHANGE
   Hidden by default to keep invoice compact.
   ========================================== */

.optional-payment-details {
  display: none;
}

.optional-payment-details.visible {
  display: block;
}

.optional-exchange {
  display: none;
}

.optional-exchange.visible {
  display: block;
}

.optional-toggle {
  display: none !important;
  align-items: center;
  gap: 9px;
  width: 100%;
  margin-top: 9px;
  padding: 11px 10px;
  border: 1px solid #9bb7dc;
  border-radius: 9px;
  background: #f7faff;
  color: #173f73;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-sizing: border-box;
}

.optional-toggle:hover {
  background: #eef5ff;
}

.optional-toggle input {
  width: 18px !important;
  height: 18px !important;
  min-height: 18px !important;
  margin: 0;
  padding: 0 !important;
  accent-color: #2867d7;
  cursor: pointer;
}

.optional-toggle .toggle-arrow {
  margin-left: auto;
  font-size: 20px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.optional-toggle:has(input:checked) .toggle-arrow {
  transform: rotate(180deg);
}

@media (max-width: 600px) {
  .optional-toggle {
    padding: 9px 8px;
    gap: 7px;
    font-size: 12px;
  }

  .optional-toggle input {
    width: 17px !important;
    height: 17px !important;
  }
}

@media print {
  .optional-toggle {
    display: none !important;
  }
}


/* ==========================================
   COMPACT THREE-OPTION DROPDOWN
========================================== */

.optional-menu {
  position: relative;
  margin: 8px 0;
  z-index: 30;
}

.optional-menu-btn {
  width: 100%;
  min-height: 42px;
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1.5px solid #9bb7dc;
  border-radius: 10px;
  background: #fff;
  color: #174a91;
  font-weight: 700;

function setInvoiceNumber(number) {
  const value = String(number || "INV-0001").trim();
  const input = document.getElementById("invoiceNumber");
  if (input) input.value = value;
}

function incrementInvoiceNumber(invoiceNo) {
  const value = String(invoiceNo || "").trim();
  const match = value.match(/^(.*?)(\d+)$/);
  if (!match) return "";

  const prefix = match[1];
  const digits = match[2];
  const next = Number(digits) + 1;
  if (!Number.isFinite(next)) return "";

  return prefix + String(next).padStart(digits.length, "0");
}

function cacheSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function loadLocations() {
  const select = document.getElementById("mainLocation");
  if (!select) return;

  const cached = cacheGet(LOCATION_CACHE_KEY);
  if (Array.isArray(cached) && cached.length) {
    locations = cached;
    locationDatabaseLoaded = true;
    populateLocationSelect();
  }

  // Cached locations are usable immediately. The server refresh runs in the background.
  const hasCachedLocations = locations.length > 0;
  select.disabled = !hasCachedLocations;
  if (!hasCachedLocations) {
    select.innerHTML = `<option value="">Loading locations...</option>`;
  } else {
    select.title = "Locations loaded from cache; refreshing in background...";
  }

  const callbackName = "bbLocations_" + Date.now();
  const script = document.createElement("script");
  let done = false;

  function finish() {
    if (done) return;
    done = true;
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function(data) {
    if (Array.isArray(data)) {
      locations = data.map(row => ({
        locationCode: String(row.locationCode || row.code || "").trim(),
        locationName: String(row.locationName || row.name || "").trim(),
        salespersonName: String(row.salespersonName || row.salesperson || "").trim(),
        active: row.active === true || String(row.active).toLowerCase() === "true"
      })).filter(x => x.locationCode && x.locationName && x.active !== false);

      locationDatabaseLoaded = locations.length > 0;
      cacheSet(LOCATION_CACHE_KEY, locations);
      populateLocationSelect();
    }
    finish();
  };

  script.onerror = function() {
    finish();
    if (!locations.length) {
      select.innerHTML = `<option value="">Location database unavailable</option>`;
      select.disabled = true;
    } else {
      select.disabled = false;
      select.title = "Using cached locations";
    }
  };

  script.src = CUSTOMER_API_URL +
    "?action=getLocations&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();
  document.body.appendChild(script);

  setTimeout(() => {
    if (!done) {
      finish();
      if (!locations.length) {
        select.innerHTML = `<option value="">Location loading timed out — refresh to retry</option>`;
        select.disabled = true;
      } else {
        select.disabled = false;
        select.title = "Using cached locations; server refresh timed out";
      }
    }
  }, LOCATION_REQUEST_TIMEOUT_MS);
}

function populateLocationSelect() {
  const select = document.getElementById("mainLocation");
  if (!select) return;

  const previous = currentLocationCode || select.value || "";
  select.innerHTML = `<option value="">Select Main Location</option>`;
  locations.forEach(location => {
    const option = document.createElement("option");
    option.value = location.locationCode;
    option.textContent = `${location.locationCode} — ${location.locationName}`;
    select.appendChild(option);
  });

  if (previous && locations.some(x => x.locationCode === previous)) {
    select.value = previous;
  }
  select.disabled = false;

  const savedLocation = sessionStorage.getItem("bb_invoice_location_code_v1");
  if (!currentLocationCode && savedLocation && locations.some(x => x.locationCode === savedLocation)) {
    select.value = savedLocation;
    handleLocationChange(true);
  }
}

function handleLocationChange(fromSession = false) {
  const select = document.getElementById("mainLocation");
  const code = String(select?.value || "").trim();
  const location = locations.find(x => x.locationCode === code);
  currentLocationCode = code;
  locationCustomersLoaded = false;

  if (code) sessionStorage.setItem("bb_invoice_location_code_v1", code);
  else sessionStorage.removeItem("bb_invoice_location_code_v1");

  const customerInput = document.getElementById("customerName");
  if (customerInput) customerInput.value = "";
  const phone = document.getElementById("customerPhone");
  const address = document.getElementById("customerAddress");
  if (phone) phone.value = "";
  if (address) address.value = "";
  const list = document.getElementById("customerOptions");
  if (list) { list.innerHTML = ""; list.style.display = "none"; }

  const status = document.getElementById("customerStatus");

  if (!location) {
    if (status) status.textContent = "Select a Main Location first.";
    customers = [];
    return;
  }

  const savedOverride = sessionStorage.getItem(SALESPERSON_SESSION_KEY);
  const salesInput = document.getElementById("salesName");
  if (salesInput && (!savedOverride || !fromSession)) {
    // If the user had manually typed a replacement, keep it. Otherwise use the location default.
    const lastDefault = salesInput.dataset.locationDefault || "";
    const currentValue = salesInput.value.trim();
    if (!currentValue || currentValue === lastDefault) {
      salesInput.value = location.salespersonName || "";
    }
  }
  if (salesInput && !savedOverride && !salesInput.value.trim()) {
    salesInput.value = location.salespersonName || "";
  }
  if (salesInput) salesInput.dataset.locationDefault = location.salespersonName || "";

  loadCustomersByLocation(code);
}

function loadCustomersByLocation(locationCode) {
  const status = document.getElementById("customerStatus");
  const list = document.getElementById("customerOptions");
  const code = String(locationCode || "").trim();
  const token = ++locationRequestToken;
  if (!code) return;

  const cached = cacheGet(CUSTOMER_CACHE_PREFIX + encodeURIComponent(code));
  if (Array.isArray(cached)) {
    customers = cached;
    locationCustomersLoaded = true;
    renderCustomerOptionsBase();
    if (status) {
      status.textContent = `${customers.length} customers loaded for ${code}`;
      status.style.color = "#2f855a";
    }
  } else if (status) {
    status.textContent = "Loading customers for this location...";
    status.style.color = "#718096";
  }

  const callbackName = "bbLocationCustomers_" + Date.now() + "_" + Math.floor(Math.random()*10000);
  const script = document.createElement("script");
  let done = false;

  function finish() {
    if (done) return;
    done = true;
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function(data) {
    if (token !== locationRequestToken) { finish(); return; }
    if (Array.isArray(data)) {
      customers = data.map(row => ({
        name: String(row.name || "").trim(),
        phone: String(row.phone || "").trim(),
        address: String(row.address || "").trim(),
        locationCode: String(row.locationCode || code).trim()
      })).filter(row => row.name);
      cacheSet(CUSTOMER_CACHE_PREFIX + encodeURIComponent(code), customers);
      locationCustomersLoaded = true;
      renderCustomerOptionsBase();
      if (status) {
        status.textContent = customers.length ? `${customers.length} customers loaded for ${code}` : "No customers found for this location.";
        status.style.color = customers.length ? "#2f855a" : "#b7791f";
      }
    }
    finish();
  };

  script.onerror = function() { finish(); };
  script.src = CUSTOMER_API_URL +
    "?action=getCustomersByLocation&locationCode=" + encodeURIComponent(code) +
    "&callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
  document.body.appendChild(script);

  setTimeout(() => { if (!done) finish(); }, DB_REQUEST_TIMEOUT_MS);
}

function renderCustomerOptionsBase() {
  const list = document.getElementById("customerOptions");
  if (!list) return;
  list.innerHTML = "";
}

/* ==========================================
   LOAD CUSTOMER-SPECIFIC PRICES
   Sheet: Customer Prices (matrix format)
   Row 1: Product Codes (B1 onward)
   Row 2: Product Names (B2 onward)
   Row 3+: Customer rows (A = Customer Name)
   Blank price = use standard Products price
========================================== */
function loadCustomerPrices(customerName) {
  const name = String(customerName || "").trim();
  const status = document.getElementById("customerStatus");
  const token = ++customerPriceRequestToken;

  customerPrices = {};
  customerPriceCustomer = name;
  customerPriceLoaded = false;

  if (!name) {
    if (status) {
      status.textContent = customers.length
        ? `${customers.length} customers loaded from Google Sheets`
        : "No customers found — you can still type manually.";
      status.style.color = customers.length ? "#2f855a" : "#b7791f";
    }
    applyCustomerPricesToProducts();
    return;
  }

  if (status) {
    status.textContent = "Loading customer prices...";
    status.style.color = "#718096";
  }

  const callbackName = "bbCustomerPrices_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
  const script = document.createElement("script");
  let done = false;

  function finish() {
    if (done) return;
    done = true;
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function(data) {
    if (token !== customerPriceRequestToken) {
      finish();
      return;
    }

    // Apps Script returns the matrix format:
    // { customer, found, prices: { PRODUCT_CODE: { productCode, productName, priceUSD } } }
    // Keep backward compatibility with the older array format too.
    if (data && typeof data === "object" && !Array.isArray(data) && data.prices) {
      const prices = data.prices || {};
      Object.keys(prices).forEach(codeKey => {
        const row = prices[codeKey] || {};
        const code = String(row.productCode || codeKey || "").trim();
        const price = Number(row.priceUSD);
        if (code && Number.isFinite(price)) {
          customerPrices[code] = price;
        }
      });
    } else if (Array.isArray(data)) {
      data.forEach(row => {
        const code = String(row.productCode || row.code || "").trim();
        const price = Number(row.priceUSD);
        if (code && Number.isFinite(price)) {
          customerPrices[code] = price;
        }
      });
    }

    customerPriceLoaded = true;

    if (status) {
      const count = Object.keys(customerPrices).length;
      status.textContent = count
        ? `Customer selected • ${count} special price${count === 1 ? "" : "s"} loaded`
        : "Customer selected • using standard product prices";
      status.style.color = "#2f855a";
    }

    applyCustomerPricesToProducts();
    finish();
  };

  script.onerror = function() {
    if (token !== customerPriceRequestToken) {
      finish();
      return;
    }
    finish();
    if (status) {
      status.textContent = "Still loading customer prices... retrying";
      status.style.color = "#718096";
    }
    retryDatabaseLoad(() => loadCustomerPrices(name), () => customerPriceLoaded);
  };

  script.src =
    CUSTOMER_API_URL +
    "?action=customerPrices&customer=" +
    encodeURIComponent(name) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  document.body.appendChild(script);

  setTimeout(() => {
    if (!done && token === customerPriceRequestToken) {
      finish();
      if (status) {
        status.textContent = "Still loading customer prices... retrying";
        status.style.color = "#718096";
      }
      retryDatabaseLoad(() => loadCustomerPrices(name), () => customerPriceLoaded);
    }
  }, DB_REQUEST_TIMEOUT_MS);
}

function getPriceForProduct(product) {
  if (!product) return 0;
  if (Object.prototype.hasOwnProperty.call(customerPrices, product.code)) {
    return customerPrices[product.code];
  }
  return product.usdPrice;
}

function applyCustomerPricesToProducts() {
  const rows = document.querySelectorAll("#productList .product");
  const currency = getCurrency();

  rows.forEach(row => {
    const code = row.dataset.productCode || "";
    const name = row.dataset.product || "";
    const item = selectedProducts.find(p => p.id === name);
    const product = products.find(p => p.code === code || p.name === name);

    if (!item || !product || item.manualPrice) return;

    const effectiveUsdPrice = getPriceForProduct(product);
    item.usdPrice = effectiveUsdPrice;
    row.dataset.usdPrice = effectiveUsdPrice;

    const priceInput = row.querySelectorAll("input")[1];
    if (priceInput) {
      priceInput.value = usdToSelected(effectiveUsdPrice, currency);
      priceInput.step = currency === "KHR" ? "1" : "0.01";
    }
  });

  calculate();
}

function showCustomerOptions() {
  const input = document.getElementById("customerName");
  const list = document.getElementById("customerOptions");

  if (!input || !list || !customers.length) return;

  const query = input.value.trim().toLowerCase();

  const matches = customers.filter(customer =>
    customer.name.toLowerCase().includes(query) ||
    customer.phone.toLowerCase().includes(query) ||

let products = [];

let selectedProducts = [];

// Load products only after the product state variables exist.

/* ==========================================
   HELPERS
========================================== */

function getCurrency() {
  return document.getElementById("currency").value;
}

function getExchangeRate() {
  return Number(document.getElementById("exchangeRate").value) || 0;
}

function usdToSelected(usdValue, currency) {
  if (currency === "KHR") {
    return usdValue * getExchangeRate();
  }

  return usdValue;
}

function selectedToUsd(value, currency) {
  if (currency === "KHR") {
    const rate = getExchangeRate();
    return rate > 0 ? value / rate : 0;
  }

  return value;
}

function formatMoney(value, currency) {
  if (currency === "USD") {
    return "$" + Number(value).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  return "៛" + Math.round(Number(value)).toLocaleString("en-US");
}


/* ==========================================
   LOAD PRODUCTS
   Google Sheets -> Apps Script Web App
   Products sheet:
   A Product Code
   B Product Name
   C Category
   D Unit
   E Price USD
   F Active
========================================== */

function loadProducts() {
  const selector = document.getElementById("productSelector");
  const choice = document.getElementById("productChoice");

  if (!selector || !choice) return;

  productDatabaseLoaded = false;
  choice.innerHTML = `<option value="">Loading products...</option>`;
  choice.disabled = true;

  const callbackName =
    "bbProducts_" + Date.now();

  const script = document.createElement("script");
  let done = false;

  function finish() {
    if (done) return;
    done = true;
    delete window[callbackName];
    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }

  window[callbackName] = function(data) {
    if (!Array.isArray(data)) {
      products = [];
      choice.innerHTML = `<option value="">Product database unavailable</option>`;
      choice.disabled = true;
      finish();
      return;
    }

    products = data
      .map(row => ({
        code: String(row.code || "").trim(),
        name: String(row.name || "").trim(),
        category: String(row.category || "").trim(),
        unit: String(row.unit || "").trim(),
        usdPrice: Number(row.priceUSD) || 0,
        active: row.active === true || String(row.active).toLowerCase() === "true"
      }))
      .filter(product => product.name && product.active);

    productDatabaseLoaded = true;
    choice.innerHTML = `<option value="">Select Product</option>`;
    choice.disabled = false;
    finish();
  };

  script.onerror = function() {
    finish();
    choice.innerHTML = `<option value="">Still loading products... retrying</option>`;
    choice.disabled = true;
    retryDatabaseLoad(loadProducts, () => productDatabaseLoaded);
  };

  script.src =
    CUSTOMER_API_URL +
    "?action=products&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  document.body.appendChild(script);

  setTimeout(() => {
    if (!done) {
      finish();
      choice.innerHTML = `<option value="">Still loading products... retrying</option>`;
      choice.disabled = true;
      retryDatabaseLoad(loadProducts, () => productDatabaseLoaded);
    }
  }, DB_REQUEST_TIMEOUT_MS);
}


/* ==========================================
   SHOW PRODUCT SELECTOR
========================================== */

function showProductSelector(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (!productDatabaseLoaded) {
    alert("Product database is still loading. Please wait a moment and try again.");
    loadProducts();
    return;
  }

  const selector =
    document.getElementById("productSelector");

  const choice =
    document.getElementById("productChoice");

  const availableProducts =
    products.filter(product =>
      !selectedProducts.some(
        item => item.id === product.name
      )
    );

  if (availableProducts.length === 0) {
    alert("All products have already been added.");
    return;
  }

  /*
   * Open the product dropdown immediately.
   * The user can select a product without needing
   * another Add button.
   */
  selector.style.display = "block";

  choice.innerHTML = `
    <option value="">Select Product</option>
  `;

  availableProducts.forEach(product => {
    const option =
      document.createElement("option");

    option.value = product.name;
    option.textContent = product.name;

    choice.appendChild(option);
  });

  /*
   * Put the cursor/focus directly on the dropdown.
   * On mobile this opens the native picker when supported.
   */
  choice.focus();

  /*
   * Scroll just enough to keep the picker visible.
   */
  setTimeout(() => {
    selector.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }, 50);
}


/* ==========================================
   ADD SELECTED PRODUCT - INSTANT
========================================== */

function addSelectedProduct() {
  const choice =
    document.getElementById("productChoice");

  const productName =
    choice.value;

  if (!productName) return;

  const product =
    products.find(
      p => p.name === productName
    );

  if (!product) return;

  /*
   * Add immediately when the user selects it.
   */
  const effectiveUsdPrice = getPriceForProduct(product);

  selectedProducts.push({
    id: product.name,
    usdPrice: effectiveUsdPrice,
    manualPrice: false
  });

  createProduct(
    product.name,
    effectiveUsdPrice
  );

  calculate();

  /*
   * Refresh the same dropdown so the user can
   * immediately choose another product.
   *
   * No need to press "+ Add Product" again.
   */
  const availableProducts =
    products.filter(product =>
      !selectedProducts.some(
        item => item.id === product.name
      )
    );

  choice.innerHTML = `
    <option value="">＋ Select another product</option>
  `;

  availableProducts.forEach(product => {
    const option =
      document.createElement("option");

    option.value = product.name;
    option.textContent = product.name;

    choice.appendChild(option);
  });

  /*
   * Keep the picker open if products remain.
   * Hide it automatically when every product is used.
   */
  if (availableProducts.length === 0) {
    document.getElementById(
      "productSelector"
    ).style.display = "none";
  } else {
    choice.focus();
  }
}


/* ==========================================
   CREATE PRODUCT
========================================== */

function createProduct(name, defaultUsdPrice) {
  const container = document.getElementById("productList");
  const div = document.createElement("div");
  const productRecord = products.find(p => p.name === name);

  div.className = "product";
  div.dataset.product = name;
  div.dataset.productCode = productRecord ? productRecord.code : "";
  div.dataset.usdPrice = defaultUsdPrice;

  const currency = getCurrency();
  const displayPrice = usdToSelected(defaultUsdPrice, currency);

  div.innerHTML = `
    <div class="product-name-cell">
      <div class="product-name">${escapeHtml(name)}</div>
      <button
        type="button"
        class="remove-btn no-print"
        onclick="removeProduct(this)"
        aria-label="Remove ${escapeHtml(name)}"
      >×</button>
    </div>

    <div class="product-input-cell">
      <input
        type="number"
        min="0"
        value=""
        placeholder="0"
        inputmode="decimal"
        aria-label="Quantity for ${escapeHtml(name)}"
        oninput="calculate()"
      >
    </div>

    <div class="product-input-cell">
      <input
        type="number"
        min="0"
        value="${displayPrice}"
        step="${currency === "KHR" ? "1" : "0.01"}"
        inputmode="decimal"
        aria-label="Price for ${escapeHtml(name)}"
        oninput="priceChanged(this)"
      >
    </div>

    <div class="product-total-cell">
      <span class="line-total">${formatMoney(0, currency)}</span>
    </div>
  `;

  container.appendChild(div);

  /*
   * After selecting the product, immediately move the user
   * into QTY. No extra button or click is required.
   */
  const qtyInput = div.querySelectorAll("input")[0];
  if (qtyInput) {
    setTimeout(() => qtyInput.focus(), 80);
  }
}


/* ==========================================
   PRICE CHANGE
   User can freely adjust the price.
========================================== */

function priceChanged(input) {
  const product = input.closest(".product");
  const currency = getCurrency();
  const enteredPrice = Number(input.value) || 0;

  product.dataset.usdPrice =
    selectedToUsd(enteredPrice, currency);

  const item = selectedProducts.find(
    p => p.id === product.dataset.product
  );

  if (item) {
    item.usdPrice = Number(product.dataset.usdPrice);
    item.manualPrice = true;
  }

  calculate();
}


/* ==========================================
   REMOVE PRODUCT
========================================== */

function removeProduct(button) {
  const product = button.closest(".product");
  const name = product.dataset.product;

  selectedProducts =
    selectedProducts.filter(item => item.id !== name);

  product.remove();

  calculate();
}

/* ==========================================
   DISCOUNT CURRENCY
========================================== */

function updateDiscountCurrency() {
  const currency =
    getCurrency();

  const symbol =
    document.getElementById("discountCurrencySymbol");

  const discount =
    document.getElementById("discount");

  if (!symbol) return;

  if (currency === "KHR") {
    symbol.textContent = "៛";

    if (discount) {
      discount.step = "1";
    }
  } else {
    symbol.textContent = "$";

    if (discount) {
      discount.step = "0.01";
    }
  }
}

function calculate() {
  updateDiscountCurrency();

  let total = 0;
  const currency = getCurrency();

  document.querySelectorAll(".product").forEach(product => {

    const inputs = product.querySelectorAll("input");

    const qty = Number(inputs[0].value) || 0;
    const price = Number(inputs[1].value) || 0;

    const lineTotal = qty * price;
    total += lineTotal;

    product.querySelector(".line-total").textContent =
      formatMoney(lineTotal, currency);
  });


  /* SUBTOTAL */

  document.getElementById("subtotal").textContent =
    formatMoney(total, currency);


  /* DISCOUNT */

  const discount =
    Number(document.getElementById("discount").value) || 0;

  const finalTotal =
    Math.max(0, total - discount);


  /* GRAND TOTAL */

  document.getElementById("grandTotal").textContent =
    formatMoney(finalTotal, currency);


  /* PAYMENT / CREDIT AMOUNT */

  const paymentMethod =
    document.getElementById("paymentMethod")?.value || "Cash";

  const amountPaidInput = document.getElementById("amountPaid");
  const enteredAmountPaid =
    Number(amountPaidInput?.value) || 0;

  // Cash and Bank are fully paid methods.
  // Credit has no payment received.
  // Partial methods use the amount entered by the accountant.
  let amountPaid = enteredAmountPaid;

  if (paymentMethod === "Cash" || paymentMethod === "Bank") {
    amountPaid = finalTotal;
    if (amountPaidInput) amountPaidInput.value = finalTotal;
  } else if (paymentMethod === "Credit") {
    amountPaid = 0;
    if (amountPaidInput) amountPaidInput.value = 0;
  } else {
    amountPaid = Math.min(Math.max(0, enteredAmountPaid), finalTotal);
  }

  // Credit Amount is always Grand Total - Amount Paid.
  const creditAmountValue =
    Math.max(0, finalTotal - amountPaid);

  const change = 0;
  const outstanding = creditAmountValue;

  const changeLabel = document.getElementById("changeLabel");
  const changeAmount = document.getElementById("changeAmount");
  const creditRow = document.querySelector(".credit-row");
  const creditAmount = document.getElementById("creditAmount");

  if (changeAmount) {
    changeAmount.textContent = formatMoney(change, currency);
  }

  // Show Credit Amount whenever any balance remains.
  if (creditRow) {
    creditRow.style.display = outstanding > 0 ? "" : "none";
  }
  if (creditAmount) {
    creditAmount.textContent = formatMoney(creditAmountValue, currency);
  }

  if (changeLabel) {
    changeLabel.textContent = "Credit Amount";
  }


  /* EXCHANGE */

  calculateExchange(finalTotal, currency);
}


/* ==========================================
   PAYMENT METHOD
   Cash / Bank = fully paid
   Credit = Amount Paid + remaining Credit
========================================== */

function handlePaymentMethodChange() {
  const paymentMethod = document.getElementById("paymentMethod")?.value || "Cash";
  const needsBank =
    paymentMethod === "Bank" ||
    paymentMethod === "Partially Paid in Bank";

  const bankRow = document.getElementById("paymentBankRow");
  const referenceRow = document.getElementById("bankReferenceRow");
  const bankSelect = document.getElementById("paymentBank");
  const referenceInput = document.getElementById("bankReference");

  if (bankRow) bankRow.style.display = needsBank ? "" : "none";
  if (referenceRow) referenceRow.style.display = needsBank ? "" : "none";

  if (!needsBank) {
    if (bankSelect) bankSelect.value = "";
    if (referenceInput) referenceInput.value = "";
  }

  const amountPaidInput = document.getElementById("amountPaid");
  if (amountPaidInput) {
    if (paymentMethod === "Cash" || paymentMethod === "Bank") {
      const currentGrandTotal = document.getElementById("grandTotal")?.textContent || "";
      amountPaidInput.value = Number(currentGrandTotal.replace(/[^0-9.-]/g, "")) || 0;
    } else if (paymentMethod === "Credit") {
      amountPaidInput.value = 0;
    }
  }

  calculate();
}


/* ==========================================
   CURRENCY CHANGE
   Convert existing product prices so that
   the actual price remains the same.
========================================== */

function changeCurrency() {
  const currency = getCurrency();
  const rate = getExchangeRate();

  if (currency === "KHR" && rate <= 0) {
    alert("Please enter a valid exchange rate.");
    document.getElementById("currency").value = "USD";
    return;
  }

  document.querySelectorAll(".product").forEach(product => {
    const inputs = product.querySelectorAll("input");

    const usdPrice = Number(product.dataset.usdPrice) || 0;

    inputs[1].value =
      usdToSelected(usdPrice, currency);

    inputs[1].step =
      currency === "KHR" ? "1" : "0.01";
  });

  calculate();
}


/* ==========================================
   EXCHANGE CALCULATION
   Always shows BOTH currencies.
========================================== */

function calculateExchange(finalTotal, currency) {
  const rate = getExchangeRate();
  const result = document.getElementById("convertResult");

  if (rate <= 0) {
    result.textContent = "Enter exchange rate";
    return;
  }

  let usd;
  let khr;

  if (currency === "USD") {
    usd = finalTotal;
    khr = finalTotal * rate;
  } else {
    khr = finalTotal;
    usd = finalTotal / rate;
  }

  result.innerHTML =
    `<div>${formatMoney(usd, "USD")}</div>` +
    `<div>=</div>` +
    `<div>${formatMoney(khr, "KHR")}</div>`;
}

function formatInvoiceDate(dateValue) {
  if (!dateValue) return "";

  const parts = dateValue.split("-");
  if (parts.length !== 3) return dateValue;

  const [year, month, day] = parts;
  const months = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
  ];

  return `${day}-${months[Number(month) - 1]}-${year}`;
}

    updateDueDate();
  }
}

function getFinalInvoiceState() {
  const currency = getCurrency();
  const rate = getExchangeRate();
  let subtotal = 0;
  const items = [];

  document.querySelectorAll(".product").forEach((product, index) => {
    const inputs = product.querySelectorAll("input");
    const qty = Number(inputs[0]?.value) || 0;
    const price = Number(inputs[1]?.value) || 0;
    const lineTotal = qty * price;
    subtotal += lineTotal;

    const productCode = product.dataset.productCode ||
      products.find(p => p.name === product.dataset.product)?.code || "";

    items.push({
      no: index + 1,
      productCode,
      name: product.dataset.product || product.querySelector(".product-name")?.textContent?.trim() || "Product",
      qty,
      price,
      total: lineTotal,
      unit: products.find(p => p.code === productCode || p.name === product.dataset.product)?.unit || ""
    });
  });

  const discount = Number(document.getElementById("discount")?.value) || 0;
  const grandTotal = Math.max(0, subtotal - discount);

  const paymentMethod = document.getElementById("paymentMethod")?.value || "Cash";
  const enteredAmountPaid = Number(document.getElementById("amountPaid")?.value) || 0;

  let amountPaid = enteredAmountPaid;
  if (paymentMethod === "Cash" || paymentMethod === "Bank") {
    amountPaid = grandTotal;
  } else if (paymentMethod === "Credit") {
    amountPaid = 0;
  } else {
    amountPaid = Math.min(Math.max(0, enteredAmountPaid), grandTotal);
  }

  const creditAmount = Math.max(0, grandTotal - amountPaid);
  const change = 0;
  const outstanding = creditAmount;

  // Due Date is shown whenever there is an unpaid balance.
  const invoiceHasCredit = outstanding > 0;

  const showDiscount = document.getElementById("showDiscount")?.checked === true;
  const showPayment = document.getElementById("showPayment")?.checked === true;
  const showExchange = document.getElementById("showExchange")?.checked === true;

  let exchangeUsd = grandTotal;
  let exchangeKhr = grandTotal * rate;
  if (currency === "KHR") {
    exchangeKhr = grandTotal;
    exchangeUsd = rate > 0 ? grandTotal / rate : 0;
  }

  return {
    currency, rate, items, subtotal, discount, grandTotal,
    amountPaid, change, creditAmount, outstanding, invoiceHasCredit, showDiscount, showPayment, showExchange,
    exchangeUsd, exchangeKhr,
    invoiceNo: document.getElementById("invoiceNumber")?.value.trim() || "",
    date: formatInvoiceDate(document.getElementById("invoiceDate")?.value || ""),
    dueDate: formatInvoiceDate(document.getElementById("dueDate")?.value || ""),
    batchNumber: document.getElementById("batchNumber")?.value.trim() || "",
    locationCode: currentLocationCode || document.getElementById("mainLocation")?.value.trim() || "",
    customer: document.getElementById("customerName")?.value.trim() || "",
    phone: document.getElementById("customerPhone")?.value.trim() || "",
    address: document.getElementById("customerAddress")?.value.trim() || "",
    salesperson: document.getElementById("salesName")?.value.trim() || "",
    paymentMethod: document.getElementById("paymentMethod")?.value || "",
    paymentBank: document.getElementById("paymentBank")?.value || "",
    bankReference: document.getElementById("bankReference")?.value.trim() || "",
    note: document.getElementById("invoiceNote")?.value.trim() || "",
    banking: (() => {
      const select = document.getElementById("bankingDetails");
      const selectedValue = String(select?.value ?? "").trim();
      if (selectedValue === "") return null;
      const item = bankingDetails[Number(selectedValue)];
      return item ? {name: item.name, bank: item.bank, account: item.account, selected: true} : null;
    })()
  };
}

async function createInvoiceImage() {
  if (typeof html2canvas !== "function") {
    throw new Error("Image library is not loaded.");
  }

  calculate();
  const state = getFinalInvoiceState();

  const wrapper = document.createElement("div");
  wrapper.innerHTML = buildFinalInvoiceHtml(state);
  const invoice = wrapper.firstElementChild;

  wrapper.style.position = "fixed";
  wrapper.style.left = "-100000px";
  wrapper.style.top = "0";
  wrapper.style.width = "794px";
  wrapper.style.background = "#fff";
  wrapper.style.zIndex = "-1";
  document.body.appendChild(wrapper);

  try {
    const canvas = await html2canvas(invoice, {
      backgroundColor: "#ffffff",
      scale: Math.min(3, Math.max(2, window.devicePixelRatio || 1)),
      useCORS: true,
      logging: false
    });

    return await new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error("Could not create image."));
      }, "image/png");
    });
  } finally {
    wrapper.remove();
  }
}

async function saveToDrive(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const button =
    event?.currentTarget ||
    document.querySelector("button[onclick*='saveToDrive']");

  const oldText = button ? button.innerHTML : "";

  try {
    if (button) {
      button.disabled = true;
      button.innerHTML = "⏳ Saving to Drive...";
    }

    const blob = await createInvoiceImage();

    const invoiceNo =
      document.getElementById("invoiceNumber").value.trim() ||
      "Invoice";

    const customer =
      document.getElementById("customerName").value.trim() ||
      "Customer";

    const date =
      formatInvoiceDate(
        document.getElementById("invoiceDate").value
      );

    const safeInvoice =
      invoiceNo.replace(/[^a-z0-9_-]+/gi, "-").replace(/^-+|-+$/g, "") ||
      "Invoice";

    const safeCustomer =
      customer.replace(/[^a-z0-9\u0080-\uFFFF_-]+/gi, "-").replace(/^-+|-+$/g, "") ||
      "Customer";

    const fileName =
      `BIG-BROTHER-${safeInvoice}-${safeCustomer}-${date}.png`;

    const base64 = await blobToBase64(blob);

    /*
     * Use a real HTML form POST instead of fetch().
     * GitHub Pages -> Apps Script can be blocked by browser CORS
     * when fetch() follows the Apps Script redirect. A form POST
     * does not have that CORS problem and matches doPost(e).parameter
     * in the Apps Script.
     */
    let iframe = document.getElementById("driveSaveFrame");

    if (!iframe) {
      iframe = document.createElement("iframe");
      iframe.id = "driveSaveFrame";
      iframe.name = "driveSaveFrame";
      iframe.style.display = "none";
      document.body.appendChild(iframe);
    }

    const form = document.createElement("form");
    form.method = "POST";
    form.action = DRIVE_SAVE_API;
    form.target = "driveSaveFrame";
    form.style.display = "none";

    const fields = {
      action: "saveInvoiceImage",
      image: "data:image/png;base64," + base64,
      fileName: fileName
    };

    Object.keys(fields).forEach(key => {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = key;
      input.value = fields[key];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();

    /* The cross-origin iframe cannot expose the Apps Script response,
       but the POST request itself is sent successfully. */
    setTimeout(() => {
      form.remove();
    }, 3000);

    if (button) {
      button.innerHTML = "✅ Saved to Drive";
    }

    alert("Invoice image sent to Google Drive. Check your BIG BROTHER invoice folder.");

    setTimeout(() => {
      if (button) button.innerHTML = oldText;
    }, 1800);

  } catch (error) {
    console.error("Drive save failed:", error);

    alert(
      "Could not save to Google Drive.\n\n" +
      (error?.message || "Please try again.")
    );

  } finally {
    if (button) {
      button.disabled = false;
      if (button.innerHTML === "⏳ Saving to Drive...") {
        button.innerHTML = oldText;
      }
    }
  }
}

/* Backward-compatible name used by older share code. */
async function saveInvoiceImage(event) {
  return saveToDrive(event);
}


function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onloadend = () => {
      const result = String(reader.result || "");
      const comma = result.indexOf(",");

      resolve(
        comma >= 0
          ? result.substring(comma + 1)
          : result
      );
    };

    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function shareInvoice(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const button =
    event?.currentTarget ||
    document.querySelector(".share-btn");

  const oldText =
    button ? button.innerHTML : "";

  try {
    if (button) {
      button.disabled = true;
      button.innerHTML = "⏳ Preparing...";
    }

    const blob = await createInvoiceImage();

    const invoiceNo =
      document.getElementById("invoiceNumber").value.trim() ||
      "Invoice";

    const customer =
      document.getElementById("customerName").value.trim() ||
      "Customer";

    const safeInvoice =
      invoiceNo
        .replace(/[^a-z0-9_-]+/gi, "-")
        .replace(/^-+|-+$/g, "") ||
      "Invoice";

    const file = new File(
      [blob],
      `BIG-BROTHER-${safeInvoice}.png`,
      { type: "image/png" }
    );

    const text =
      `BIG BROTHER Invoice ${invoiceNo}\nCustomer: ${customer}`;

    /*
     * IMPORTANT:
     * On phones we NEVER open Telegram Web.
     *
     * The only reliable browser method for sending an actual
     * image into the Telegram APP is the phone's native
     * Web Share API.
     *
     * Telegram must be installed on the phone. The phone's
     * share sheet will show Telegram as an app destination.
     */
    const mobileDevice =
      /Android|iPhone|iPad|iPod|Mobile/i.test(
        navigator.userAgent
      );

    const touchDevice =
      "ontouchstart" in window ||
      navigator.maxTouchPoints > 0;

    const isMobile =
      mobileDevice || touchDevice;

    if (isMobile) {

      if (!navigator.share) {
        alert(
          "Your browser does not support sharing invoice pictures.\n\n" +
          "Please open the invoice in Google Chrome or Safari, " +
          "with the Telegram app installed."
        );
        return;
      }

      /*
       * First try sharing ONLY the image.
       * This is the most compatible format for Telegram.
       */
      try {
        if (
          navigator.canShare &&
          !navigator.canShare({ files: [file] })
        ) {
          throw new Error("This browser cannot share image files.");
        }

        await navigator.share({
          files: [file],
          title: "BIG BROTHER Invoice"
        });

        return;

      } catch (imageShareError) {

        if (
          imageShareError?.name === "AbortError"
        ) {
          return;
        }

        console.warn(
          "Image share failed:",
          imageShareError
        );
      }

      /*
       * Some Android browsers support files only when text is
       * included as well. Try the combined version.
       */
      try {
        await navigator.share({
          title: "BIG BROTHER Invoice",
          text: text,
          files: [file]
        });

        return;

      } catch (combinedShareError) {

        if (
          combinedShareError?.name === "AbortError"
        ) {
          return;
        }

        console.warn(
          "Combined image share failed:",
          combinedShareError
        );
      }

      /*
       * Last mobile fallback:
       * open the PHONE share sheet with invoice text.
       *
       * We deliberately do NOT use:
       * https://web.telegram.org/
       * or Telegram Web on mobile.
       *
       * If the browser cannot share files, it is not possible
       * for a normal webpage to force a local image attachment
       * into Telegram using a tg:// URL.
       */
      try {
        await navigator.share({
          title: "BIG BROTHER Invoice",
          text: text
        });

        return;

      } catch (textShareError) {

        if (
          textShareError?.name === "AbortError"
        ) {
          return;
        }

        console.warn(
          "Native mobile share failed:",
          textShareError
        );

        alert(
          "This browser cannot send the invoice picture directly.\n\n" +
          "Please open this invoice in Google Chrome or Safari " +
          "and make sure Telegram is installed."
        );

        return;
      }
    }

    /*
     * DESKTOP ONLY
     *
     * Desktop browsers cannot normally hand a local image
     * directly to the Telegram desktop app from a website.
     * Copy the invoice picture to the clipboard and open
     * Telegram Web so Ctrl+V can paste the image.
     */
    if (
      navigator.clipboard &&
      window.ClipboardItem
    ) {
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            "image/png": blob
          })
        ]);

        window.open(
          "https://web.telegram.org/",
          "_blank",
          "noopener"
        );

        alert(
          "Invoice picture copied.\n\n" +
          "Open the customer chat in Telegram and press Ctrl+V."
        );

        return;

      } catch (copyError) {
        console.warn(
          "Clipboard image copy failed:",
          copyError
        );
      }
    }

    /*
     * Desktop final fallback.
     */
    await saveInvoiceImage();

    window.open(
      "https://web.telegram.org/",
      "_blank",
      "noopener"
    );

  } catch (error) {

    if (error?.name === "AbortError") {
      return;
    }

    console.error(
      "Telegram share failed:",
      error
    );

    alert(
      "Could not share the invoice picture.\n\n" +
      "Please try again."
    );

  } finally {

    if (button) {
      button.disabled = false;
      button.innerHTML = oldText;
    }
  }
}

  /* Recalculate */

    calculate();

  /*
   * Close the dropdown after selecting an option.
   * The checkbox stays checked.
   */
  const panel =
    document.getElementById("optionalMenuPanel");

  const menuButton =
    document.querySelector(".optional-menu-btn");

  const arrow =
    document.getElementById("optionalMenuArrow");

  if (panel) {
    panel.classList.remove("open");
  }

  if (menuButton) {
    menuButton.setAttribute("aria-expanded", "false");
  }

  if (arrow) {
    arrow.textContent = "▼";
  }
}

   SAVE SALES INVOICE
   Google Sheets -> separate Sales Data file
   Invoice Item uses Product Code as the stable key
========================================== */

function buildSalesInvoicePayload() {
  calculate();

  const state = getFinalInvoiceState();
  const invoiceNo = state.invoiceNo || "";

  return {
    invoiceNo,
    invoiceDate: document.getElementById("invoiceDate")?.value || "",
    dueDate: document.getElementById("dueDate")?.value || "",
    batchNumber: document.getElementById("batchNumber")?.value.trim() || "",
    locationCode: state.locationCode,
    customer: state.customer,
    salesperson: state.salesperson,
    paymentMethod: state.paymentMethod,
    paymentBank: state.paymentBank,
    bankReference: state.bankReference,
    currency: state.currency,
    exchangeRate: state.rate,
    subtotal: state.subtotal,
    discount: state.discount,
    grandTotal: state.grandTotal,
    amountPaid: state.amountPaid,
    creditAmount: state.creditAmount,
    change: 0,
    outstanding: state.creditAmount,
    status: state.creditAmount > 0 ? (state.amountPaid > 0 ? "Processing" : "Unpaid") : "Paid",
    note: state.note,
    items: state.items.map(item => ({
      productCode: item.productCode,
      qty: item.qty,
      unitPrice: item.price,
      amount: item.total
    }))
  };
}

function previewInvoice(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  try {
    calculate();
    const state = getFinalInvoiceState();
    const modal = document.getElementById("invoicePreviewModal");
    const content = document.getElementById("invoicePreviewContent");
    if (!modal || !content) return;

    content.innerHTML = buildFinalInvoiceHtml(state);
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
  } catch (error) {
    console.error("Invoice preview failed:", error);
    alert("Could not create invoice preview. Please try again.");
  }
}

function closeInvoicePreview() {
  const modal = document.getElementById("invoicePreviewModal");
  if (!modal) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
}

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") closeInvoicePreview();
});

function checkInvoiceNumberAvailable(invoiceNo) {
  return new Promise((resolve, reject) => {
    const requested = String(invoiceNo || "").trim();
    if (!requested || requested === "Loading...") {
      reject(new Error("Invoice number is not ready yet."));
      return;
    }

    const callbackName = "bbCheckInvoiceNo_" + Date.now();
    const script = document.createElement("script");
    let done = false;

    function finish() {
      if (done) return;
      done = true;
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data) {
      finish();
      if (data && data.success) {
        resolve(data);
      } else {
        reject(new Error(data?.error || "Could not check the Invoice No."));
      }
    };

    script.onerror = function() {
      finish();
      reject(new Error("Could not check the Invoice No. from Sales Data."));
    };

    script.src =
      CUSTOMER_API_URL +
      "?action=checkInvoiceNumber&invoiceNo=" +
      encodeURIComponent(requested) +
      "&callback=" + encodeURIComponent(callbackName) +
      "&t=" + Date.now();

    document.body.appendChild(script);

    setTimeout(function() {
      if (!done) {
        finish();
        reject(new Error("Invoice No. check timed out."));
      }
    }, DB_REQUEST_TIMEOUT_MS);
  });
}

async function completeInvoice(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const button =
    event?.currentTarget ||
    document.querySelector(".complete-btn");

  if (window.bbInvoiceSaving) return;

  const payload = buildSalesInvoicePayload();

  if (!payload.locationCode) {
    alert("Please select a Main Location before completing the invoice.");
    return;
  }

  if (!payload.customer) {
    alert("Please select or enter a customer before completing the invoice.");
    return;
  }

  if (!payload.salesperson) {
    alert("Please enter a Sale Person before completing the invoice.");
    return;
  }

  if (!payload.invoiceNo || payload.invoiceNo === "Loading...") {
    alert("Invoice No. is not ready yet.");
    return;
  }

  if (!payload.items.length) {
    alert("Please add at least one product before completing the invoice.");
    return;
  }

  const hasValidQty = payload.items.some(item => Number(item.qty) > 0);
  if (!hasValidQty) {
    alert("Please enter quantity for at least one product.");
    return;
  }

  const confirmed = confirm(
    "Complete this invoice?\n\n" +
    "Invoice No.: " + payload.invoiceNo + "\n" +
    "This will save the invoice to the Sales Data Google Sheet."
  );

  if (!confirmed) return;

  window.bbInvoiceSaving = true;

  const oldText = button ? button.innerHTML : "";

  if (button) {
    button.disabled = true;
    button.innerHTML = "⏳ Saving...";
  }

  try {
    // Check the exact number immediately before saving.
    // Manual numbers are allowed, but the exact same Invoice No. may not be saved twice.
    const numberCheck = await checkInvoiceNumberAvailable(payload.invoiceNo);

    if (numberCheck.exists) {
      if (button) {
        button.disabled = false;
        button.innerHTML = oldText;
      }
      window.bbInvoiceSaving = false;
      alert(
        "Invoice No. " + payload.invoiceNo + " already exists in Sales Database.\n\n" +
        "Please check the hand-written invoice number.\n" +
        "Your invoice information is still here."
      );
      return;
    }

    await postSalesInvoice(payload);

    alert(
      "Invoice saved successfully to the Sales Data database.\n\n" +
      "Invoice No.: " + payload.invoiceNo
    );

    clearAllAfterSuccessfulSave();

  } catch (error) {
    console.error("Sales invoice save failed:", error);
    alert(
      "Could not save the invoice to Sales Data.\n\n" +
      (error?.message || "Please try again.") +
      "\n\nThe invoice was NOT cleared."
    );

  } finally {
    window.bbInvoiceSaving = false;

    if (button) {
      button.disabled = false;
      button.innerHTML = oldText;
    }
  }
}

function postSalesInvoice(payload) {
  return new Promise((resolve, reject) => {
    const iframeName = "bbSalesSaveFrame_" + Date.now();
    const iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    const form = document.createElement("form");
    form.method = "POST";
    form.action = CUSTOMER_API_URL;
    form.target = iframeName;
    form.style.display = "none";

    const actionInput = document.createElement("input");
    actionInput.type = "hidden";
    actionInput.name = "action";
    actionInput.value = "saveInvoice";
    form.appendChild(actionInput);

    const dataInput = document.createElement("input");
    dataInput.type = "hidden";
    dataInput.name = "invoiceData";
    dataInput.value = JSON.stringify(payload);
    form.appendChild(dataInput);

    document.body.appendChild(form);

    let settled = false;

    const finish = (success, error) => {
      if (settled) return;
      settled = true;

      setTimeout(() => {
        form.remove();
        iframe.remove();
      }, 1000);

      if (success) resolve();
      else reject(error || new Error("Sales Data save timed out."));
    };

    try {
      form.submit();
    } catch (error) {
      finish(false, error);
      return;
    }

    // The Apps Script response is cross-origin, so the browser cannot
    // reliably expose its result to this page. Wait briefly for the
    // POST to reach Apps Script and then continue.
    setTimeout(() => {
      finish(true, null);
    }, 2500);
  });
}

function clearAllAfterSuccessfulSave() {
  selectedProducts = [];

  document.getElementById("productList").innerHTML = "";
  document.getElementById("productSelector").style.display = "none";

  document.getElementById("discount").value = 0;
  document.getElementById("amountPaid").value = 0;

  const nextInvoiceNo = incrementInvoiceNumber(document.getElementById("invoiceNumber")?.value || "");
  if (nextInvoiceNo) setInvoiceNumber(nextInvoiceNo);
  else loadNextInvoiceNumber();
  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerAddress").value = "";
  document.getElementById("paymentMethod").value = "Cash";
  const paymentBank = document.getElementById("paymentBank");
  const bankReference = document.getElementById("bankReference");
  if (paymentBank) paymentBank.value = "";
  if (bankReference) bankReference.value = "";
  handlePaymentMethodChange();

  const noteInput = document.getElementById("invoiceNote");
  if (noteInput) noteInput.value = "";

  const bankSelect = document.getElementById("bankingDetails");
  if (bankSelect) bankSelect.value = "";
  updateBankingPreview();

  customerPrices = {};
  customerPriceCustomer = "";
  customerPriceLoaded = false;

  setTodayDate();
  setDueDateFromInvoiceDate();
  calculate();
}

function clearAll() {
  if (!confirm("Clear this invoice?")) return;

  selectedProducts = [];

  document.getElementById("productList").innerHTML = "";
  document.getElementById("productSelector").style.display = "none";

  document.getElementById("discount").value = 0;
  document.getElementById("amountPaid").value = 0;

  // Keep the session invoice sequence when clearing the form.
  const nextInvoiceNo = incrementInvoiceNumber(document.getElementById("invoiceNumber")?.value || "");
  if (nextInvoiceNo) setInvoiceNumber(nextInvoiceNo);
  else loadNextInvoiceNumber();
  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerAddress").value = "";
  document.getElementById("paymentMethod").value = "Cash";
  const paymentBank = document.getElementById("paymentBank");
  const bankReference = document.getElementById("bankReference");
  if (paymentBank) paymentBank.value = "";
  if (bankReference) bankReference.value = "";
  handlePaymentMethodChange();
  const noteInput = document.getElementById("invoiceNote");
  if (noteInput) noteInput.value = "";
  const bankSelect = document.getElementById("bankingDetails");
  if (bankSelect) bankSelect.value = "";

}

<script>
/* ==========================================
   DUE DATE INITIALIZATION
   Default due date = invoice date.
   User may change it manually, especially for Credit.
========================================== */
document.addEventListener("DOMContentLoaded", () => {
  const invoicePicker = document.getElementById("invoiceDate");
  const duePicker = document.getElementById("dueDate");

  if (invoicePicker && duePicker) {
    if (!invoicePicker.value) {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const dd = String(today.getDate()).padStart(2, "0");
      invoicePicker.value = `${yyyy}-${mm}-${dd}`;
      updateInvoiceDate();
    }

    if (!duePicker.value) {
      duePicker.value = invoicePicker.value;
      updateDueDate();
    }
  }

  const dueDisplay = document.getElementById("dueDateDisplay");
  if (dueDisplay) {
    dueDisplay.addEventListener("click", openDueDatePicker);
  }
});
</script>
